<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Machine — ArcadeOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><i class="bi bi-controller"></i></div>
        <div class="brand-text">
            <span class="brand-name">ArcadeOS</span>
            <span class="brand-sub">Machine Control</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-item"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a th:href="@{/machines}" class="nav-item active"><i class="bi bi-hdd-rack"></i><span>Machines</span></a>
        <a th:href="@{/analytics}" class="nav-item"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
        <a th:href="@{/h2-console}" target="_blank" class="nav-item"><i class="bi bi-database"></i><span>Database</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="system-status"><div class="status-dot online"></div><span>System Online</span></div>
    </div>
</div>

<div class="main-wrapper" id="mainWrapper">
    <header class="topbar">
        <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <div class="topbar-title">Edit Machine</div>
        <div class="topbar-actions">
            <span class="topbar-time" id="topbarTime"></span>
        </div>
    </header>

    <div class="content-inner">
        <div class="page-header">
            <div>
                <h2>Edit Machine</h2>
                <p class="page-sub" th:text="'Editing: ' + ${machine.name}">Editing machine</p>
            </div>
            <a th:href="@{/machines}" class="btn-cancel"><i class="bi bi-arrow-left me-2"></i>Back</a>
        </div>

        <div class="edit-form-wrapper">
            <form th:action="@{/machines/edit/{id}(id=${machine.id})}" method="post" th:object="${machine}">
                <div class="form-row">
                    <div class="form-group">
                        <label>Machine Name *</label>
                        <input type="text" th:field="*{name}" class="form-control dark-input" required>
                    </div>
                    <div class="form-group">
                        <label>Machine ID <small>(fixed)</small></label>
                        <input type="text" th:value="${machine.machineId}" class="form-control dark-input" disabled>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price Per Play (&#8377;) *</label>
                        <input type="number" th:field="*{pricePerPlay}" class="form-control dark-input" step="0.50" min="0.50" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" th:field="*{location}" class="form-control dark-input">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea th:field="*{notes}" class="form-control dark-input" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <a th:href="@{/machines}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-primary-glow"><i class="bi bi-floppy me-2"></i>Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updateClock() {
        const el = document.getElementById('topbarTime');
        if (el) el.textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    setInterval(updateClock,1000); updateClock();
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainWrapper').classList.toggle('sidebar-collapsed');
    }
</script>
</body>
</html>
