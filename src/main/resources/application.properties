# Server
server.port=${PORT:8080}

# Database
# On Railway: uses PostgreSQL via DATABASE_URL variable
# On local PC: falls back to H2 file database automatically
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/arcadedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=false

# Disable open-in-view warning
spring.jpa.open-in-view=false

# H2 Console ? only works on local, disabled on Railway
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf
spring.thymeleaf.cache=false

# Arcade settings
arcade.offline.threshold.minutes=5